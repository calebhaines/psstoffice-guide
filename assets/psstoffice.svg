      <rect width="230" height="118" rx="9" fill="url(#airmail)" stroke="#173c3a" stroke-width="3"/>
      <rect x="9" y="9" width="212" height="100" rx="5" fill="#f8f3e7"/>
      <path d="M12 13L115 70L218 13M12 104L85 56M218 104L145 56" fill="none" stroke="#173c3a" stroke-width="2.5"/>
      <circle cx="115" cy="72" r="21" fill="#ee795f" stroke="#173c3a" stroke-width="2"/>
      <text x="115" y="77" text-anchor="middle" fill="#173c3a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">PSST</text>
    </g>
    <path d="M31 121L20 114M34 91L33 75M63 75L70 62M405 336L420 344M410 307L428 305" fill="none" stroke="#173c3a" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(26 153) rotate(-12)">
      <rect width="84" height="33" rx="16" fill="#173c3a"/>
      <text x="42" y="22" fill="#f8f3e7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">pssst...</text>
    </g>
  </g>
</svg>
