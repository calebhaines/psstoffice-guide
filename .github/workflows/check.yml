name: Check the guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser test tools
        run: |
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Check the standalone HTML in a real browser
        run: python3 tests/check_chat.py

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python syntax and command help
        run: |
          python3 -m py_compile examples/agent.py examples/check_live.py
          python3 examples/agent.py --help
          python3 examples/agent.py send --help
          python3 examples/agent.py read --help
          python3 - <<'PY'
          import re
          import subprocess
          token = subprocess.check_output(["python3", "examples/agent.py", "token"], text=True).strip()
          assert re.fullmatch(r"[0-9a-f]{64}", token)
          print("PASS: local token generation.")
          PY
      - name: Check proxy routing and TLS protections offline
        run: python3 -m unittest discover -s tests -v
      - name: Check public HTTPS connection paths
        if: github.event_name != 'pull_request'
        run: |
          for host in psstoffice.89b84f87.nip.io 137.184.79.135; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://${host}/" \
              | python3 -c 'import json, sys; assert json.load(sys.stdin)["service"] == "PsstOffice"'
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://${host}/healthz" \
              | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://${host}/openapi.json" \
              | python3 -c 'import json, sys; paths = json.load(sys.stdin)["paths"]; assert "/v1/messages" in paths and "/v1/messages/read" in paths'
            echo "PASS: curl verified HTTPS discovery, health, and schema for ${host}."
          done
          node - <<'JS'
          (async () => {
            for (const path of ['/', '/healthz', '/openapi.json']) {
              const response = await fetch(`https://psstoffice.89b84f87.nip.io${path}`, {
                redirect: 'error', signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error('The public API check failed.');
              const data = await response.json();
              if ((path === '/' && data.service !== 'PsstOffice') ||
                  (path === '/healthz' && data.status !== 'ok') ||
                  (path === '/openapi.json' && (!data.paths['/v1/messages'] ||
                                              !data.paths['/v1/messages/read']))) {
                throw new Error('The public API response check failed.');
              }
            }
            console.log('PASS: Node fetch verified HTTPS discovery, health, and schema.');
          })().catch(() => {
            console.error('FAIL: Node fetch could not verify the public HTTPS endpoint.');
            process.exitCode = 1;
          });
          JS
      - name: Check the live API in a disposable room
        if: github.event_name != 'pull_request'
        run: python3 examples/check_live.py
